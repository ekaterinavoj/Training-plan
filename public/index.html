<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tréninkový plán</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>💪 Tréninkový plán</h1>
  <button id="save-btn" class="btn-main">Uložit plán</button>
</header>

<nav id="week-bar">
  <div id="week-tabs"></div>
  <button id="add-week-btn" class="btn-add-week">+ Nový týden</button>
</nav>

<main>
  <div class="week-head">
    <input type="text" id="week-label" class="week-label-input" placeholder="Název týdne (např. Týden 1, 12.–18. 8.)">
    <button id="remove-week-btn" class="btn-remove-week" title="Smazat tento týden">🗑 Smazat týden</button>
  </div>
  <div id="days"></div>
</main>

<template id="exercise-item-tpl">
  <div class="exercise-item">
    <div class="exercise-row">
      <input type="text" class="ex-name" placeholder="Cvik (např. Dřep)">
      <input type="number" class="ex-sets" placeholder="Série" min="0">
      <input type="number" class="ex-reps" placeholder="Opakování" min="0">
      <input type="text" class="ex-weight" placeholder="Plánovaná váha">
      <button class="btn-toggle-actual" title="Zapsat, jak to bylo doopravdy">📝 Realita</button>
      <button class="btn-remove" title="Odebrat cvik">✕</button>
    </div>
    <div class="exercise-actual" hidden>
      <span class="actual-label">Skutečnost:</span>
      <input type="text" class="ex-actual-weight" placeholder="Skutečná váha (např. 65 kg)">
      <input type="text" class="ex-note" placeholder="Poznámka (např. cítila jsem se silná)">
      <button class="btn-clear-actual" title="Zrušit zápis skutečnosti">✕</button>
    </div>
  </div>
</template>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
