<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tréninkový plán</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>💪 Tréninkový plán</h1>
  <button id="save-btn" class="btn-main">Uložit plán</button>
</header>

<nav id="mode-bar">
  <button id="mode-view-btn" class="mode-btn">👁 Zobrazit trénink</button>
  <button id="mode-edit-btn" class="mode-btn">✏️ Upravit plán</button>
</nav>

<!-- ── Zobrazení: sledování tréninku, jen zápis skutečnosti jde editovat ──── -->
<section id="viewer">
  <nav id="viewer-picker">
    <div class="picker-row">
      <span class="picker-label">Cyklus</span>
      <div class="picker-pills" id="viewer-cycle-pills"></div>
    </div>
    <div class="picker-row">
      <span class="picker-label">Týden</span>
      <div class="picker-pills" id="viewer-week-pills"></div>
    </div>
    <div class="picker-row">
      <span class="picker-label">Den</span>
      <div class="picker-pills" id="viewer-day-pills"></div>
    </div>
  </nav>
  <div id="viewer-content"></div>
</section>

<!-- ── Úprava: tvorba a editace plánu ──────────────────────────────────────── -->
<div id="editor">
  <nav id="top-bar">
    <button id="add-cycle-btn" class="btn-add-cycle">+ Nový cyklus (nový trénink)</button>
  </nav>

  <main id="cycles"></main>
</div>

<div id="toast"></div>

<!-- ── Templates ─────────────────────────────────────────────────────────── -->

<template id="cycle-tpl">
  <div class="cycle">
    <div class="cycle-head">
      <button class="cycle-toggle" title="Sbalit / rozbalit cyklus">▼</button>
      <input type="text" class="cycle-label-input" placeholder="Název cyklu (např. Cyklus 1 – Síla, 12 týdnů)">
      <button class="btn-remove-cycle" title="Smazat cyklus">🗑 Cyklus</button>
    </div>
    <div class="cycle-body">
      <nav class="week-bar">
        <div class="week-tabs"></div>
        <button class="btn-add-week">+ Nový týden</button>
      </nav>
      <div class="week-head">
        <input type="text" class="week-label-input" placeholder="Název týdne (např. Týden 1, 12.–18. 8.)">
        <button class="btn-remove-week" title="Smazat tento týden">🗑 Smazat týden</button>
      </div>
      <div class="days"></div>
      <button class="btn-add-day">+ Přidat den</button>
    </div>
  </div>
</template>

<template id="day-tpl">
  <section class="day-card">
    <div class="day-head">
      <input type="text" class="day-name-input" placeholder="Název dne (např. Pondělí)">
      <input type="text" class="focus-input" placeholder="Poznámka ke dni (volitelné)">
      <button class="btn-remove-day" title="Smazat den">✕ Den</button>
    </div>
    <div class="sections"></div>
    <button class="btn-add-section">+ Přidat sekci</button>
  </section>
</template>

<template id="section-tpl">
  <div class="section-card">
    <div class="section-head">
      <input type="text" class="section-name" placeholder="Název sekce (např. Hlavní cviky, Ramena, Core...)">
      <button class="btn-remove-section" title="Smazat sekci">✕ Sekce</button>
    </div>
    <div class="exercise-items"></div>
    <button class="btn-add-exercise">+ Přidat cvik</button>
  </div>
</template>

<template id="exercise-item-tpl">
  <div class="exercise-item">
    <div class="exercise-row">
      <input type="text" class="ex-name" placeholder="Cvik (např. Dřep)">
      <input type="number" class="ex-sets" placeholder="Série" min="0">
      <input type="number" class="ex-reps" placeholder="Opakování" min="0">
      <input type="text" class="ex-weight" placeholder="Plánovaná váha">
      <button class="btn-remove" title="Odebrat cvik">✕</button>
    </div>
    <div class="exercise-actual">
      <div class="actual-fields">
        <span class="actual-label">Realita:</span>
        <input type="number" class="ex-actual-sets" placeholder="Série" min="0">
        <input type="number" class="ex-actual-reps" placeholder="Opakování" min="0">
        <input type="text" class="ex-actual-weight" placeholder="Skutečná váha">
        <button class="btn-clear-actual" title="Vymazat zápis skutečnosti">✕</button>
      </div>
      <input type="text" class="ex-note" placeholder="Poznámka (např. cítila jsem se silná)">
    </div>
  </div>
</template>

<script src="app.js"></script>
</body>
</html>
